/* -- tokens ---------------------------------------------------------- */
:root{
  --paper:#F4EADC;        /* warm ivory notebook stock   */
  --paper-deep:#E7D7C3;   /* shadowed edge of the sheet  */
  --kraft:#D3B392;        /* kraft card / tape           */
  --ink:#2C3A54;          /* fountain-pen navy           */
  --pencil:#8A7864;       /* 2B annotations              */
  --rose:#C04E68;         /* raspberry -- the one accent  */
  --blush:#F0C6C0;        /* washi tape                  */
  --sage:#93A47C;         /* pressed leaf                */

  --hand:'Caveat', 'Bradley Hand', cursive;
  --script:'Sacramento', 'Snell Roundhand', cursive;
  --type:'Special Elite', 'Courier New', monospace;

  --rule:rgba(44,58,84,.07);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--hand);
  color:var(--ink);
  background:
    radial-gradient(120% 90% at 50% 0%, #6E5B4B 0%, #4E4137 55%, #3A3129 100%);
  display:flex; align-items:center; justify-content:center;
  padding:clamp(12px,3vw,44px);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* -- the sheet ------------------------------------------------------- */
.spread{
  position:relative;
  width:min(940px,100%);
  min-height:min(1180px, calc(100dvh - clamp(24px,6vw,88px)));
  padding:clamp(26px,4.4vw,54px) clamp(24px,5vw,64px) clamp(30px,5vw,60px) clamp(56px,8vw,104px);
  background:var(--paper);
  border-radius:3px 10px 4px 8px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.5) inset,
    0 26px 60px -18px rgba(20,14,9,.65),
    0 3px 10px rgba(20,14,9,.35);
  overflow:hidden;
  isolation:isolate;
  display:flex; flex-direction:column;
}

/* paper grain + faint rules + the red margin line */
.spread::before{
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, transparent 0 33px, var(--rule) 33px 34px),
    radial-gradient(90% 60% at 20% 10%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(70% 50% at 90% 95%, rgba(160,120,80,.16), transparent 65%);
}
.spread::after{
  content:''; position:absolute; z-index:0; pointer-events:none;
  top:0; bottom:0; left:clamp(40px,6.4vw,80px); width:1.5px;
  background:rgba(192,78,104,.28);
}
/* fibre noise */
.grain{
  position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix values='0 0 0 0 .38 0 0 0 0 .28 0 0 0 0 .18 0 0 0 .5 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  mix-blend-mode:multiply;
}
/* binder holes */
.holes{position:absolute; left:clamp(14px,2.4vw,28px); top:0; bottom:0; z-index:2;
  display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; pointer-events:none}
.holes i{
  width:clamp(15px,2vw,20px); aspect-ratio:1; border-radius:50%;
  background:#2f2820;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.6);
}

/* everything that isn't paper */
.layer{position:relative; z-index:3; flex:1; display:flex; flex-direction:column}
.mid{flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:clamp(20px,6vh,72px)}

/* -- doodle trail (the signature element) ---------------------------- */
#trail{position:absolute; inset:0; z-index:2; pointer-events:none; overflow:visible}

/* -- header line ----------------------------------------------------- */
.head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:20px;
  margin-bottom:clamp(10px,2vw,20px);
}
.eyebrow{
  font-family:var(--type); font-size:clamp(9px,1.25vw,11px);
  letter-spacing:.24em; text-transform:uppercase; color:var(--pencil);
}
/* her name up top in the script face, mine at the bottom in the same one */
.dedication{
  font-family:var(--script); font-size:clamp(28px,3.8vw,42px); line-height:.95;
  color:var(--ink); margin-top:2px; transform:rotate(-1.2deg); transform-origin:left;
}
.stamp{
  font-family:var(--type); font-size:clamp(9px,1.2vw,11px); letter-spacing:.14em;
  color:var(--rose); border:1.5px solid rgba(192,78,104,.55);
  padding:5px 9px 4px; border-radius:2px; transform:rotate(3.4deg);
  opacity:.72; white-space:nowrap;
}

/* -- polaroid -------------------------------------------------------- */
.pinned{
  position:relative; width:clamp(180px,25vw,236px); margin:0 0 clamp(14px,2.4vw,26px) auto;
  transform:rotate(3.2deg); transform-origin:50% 0;
  transition:transform .9s cubic-bezier(.2,.9,.25,1);
}
.polaroid{
  background:#FCF9F3; padding:12px 12px 44px;
  box-shadow:0 8px 18px -6px rgba(40,28,16,.45), 0 1px 2px rgba(40,28,16,.3);
}
.polaroid .well{
  aspect-ratio:1/1; background:#EFE6DA; display:grid; place-items:center; overflow:hidden;
}
.polaroid .well img{width:100%; height:100%; object-fit:cover; display:block}
.polaroid figcaption{
  font-family:var(--hand); font-size:clamp(17px,2.2vw,21px); color:var(--pencil);
  text-align:center; margin-top:9px; line-height:1;
}
.tape{
  position:absolute; width:96px; height:26px; background:rgba(240,198,192,.72);
  box-shadow:0 1px 2px rgba(60,40,30,.18);
  clip-path:polygon(3% 0,97% 4%,100% 96%,2% 100%);
}
.tape.t1{top:-13px; left:-16px; transform:rotate(-24deg)}
.tape.t2{bottom:24px; right:-22px; transform:rotate(-8deg); width:78px}
.tape::after{content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 3px, transparent 3px 7px)}

/* -- the ask --------------------------------------------------------- */
.ask{
  font-family:var(--hand); font-weight:700;
  font-size:clamp(40px,7.6vw,78px); line-height:.98; margin:0 0 .28em;
  max-width:15ch; letter-spacing:-.005em;
}
.ask em{font-style:normal; color:var(--rose); position:relative; white-space:nowrap}
.ask em svg{position:absolute; left:-2%; bottom:-.16em; width:104%; height:.3em; overflow:visible}
.sub{
  font-family:var(--hand); font-size:clamp(19px,2.5vw,25px); color:var(--pencil);
  margin:0 0 clamp(26px,4.6vw,44px); max-width:34ch; line-height:1.32;
}

/* -- buttons --------------------------------------------------------- */
.choices{position:relative; min-height:118px}

.btn{
  font-family:var(--hand); font-weight:700; border:0; cursor:pointer;
  padding:.42em .96em .5em; line-height:1; border-radius:2px;
  transition:transform .42s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, background .3s;
}
.btn:focus-visible{outline:3px dashed var(--ink); outline-offset:5px}

#yes{
  position:relative; font-size:clamp(34px,4.6vw,48px);
  color:#FFF6F2; background:var(--rose);
  box-shadow:0 6px 0 #9B3A51, 0 14px 24px -8px rgba(120,40,60,.55);
  transform:rotate(-2deg) scale(var(--s,1)); transform-origin:center;
}
#yes:hover{box-shadow:0 8px 0 #9B3A51, 0 20px 30px -8px rgba(120,40,60,.6)}
#yes:active{transform:rotate(-2deg) scale(var(--s,1)) translateY(4px); box-shadow:0 2px 0 #9B3A51}

#no{
  position:absolute; font-size:clamp(24px,3.1vw,32px);
  color:var(--ink); background:#FBF4E9;
  box-shadow:0 2px 0 rgba(140,110,80,.4), 0 8px 14px -6px rgba(60,40,20,.35);
  transform:rotate(var(--r,2deg)) scale(var(--s,1));
  z-index:6; touch-action:manipulation;
}
#no::before{ /* the strip of tape holding it down */
  content:''; position:absolute; top:-9px; left:50%; width:52px; height:17px;
  transform:translateX(-50%) rotate(-6deg);
  background:rgba(211,179,146,.66);
  clip-path:polygon(4% 0,96% 5%,100% 95%,0 100%);
}
#no.gone{transition:transform .8s cubic-bezier(.4,.1,.7,1), opacity .8s; opacity:0; pointer-events:none}

.aside{
  font-family:var(--hand); font-size:clamp(17px,2.1vw,20px); color:var(--pencil);
  opacity:0; transition:opacity .7s .25s; transform:rotate(-1.4deg);
  /* Yes grows via transform, which leaves its layout box behind -- clear it */
  margin-top:clamp(36px,5vh,58px); position:relative;
}
.aside.show{opacity:.85}

/* -- signature ------------------------------------------------------- */
.sign{
  position:absolute; right:clamp(24px,5vw,64px); bottom:clamp(26px,4vw,48px);
  text-align:right; z-index:4;
}
.sign small{font-family:var(--hand); font-size:clamp(16px,1.9vw,19px); color:var(--pencil); display:block}
.sign span{font-family:var(--script); font-size:clamp(36px,5vw,52px); color:var(--ink); line-height:.9; display:block}

/* -- music switch ---------------------------------------------------- */
.music{
  position:absolute; z-index:7; left:clamp(56px,8vw,104px); bottom:clamp(24px,3.6vw,44px);
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--type); font-size:11px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--pencil); background:rgba(251,244,233,.9); border:1.5px dashed rgba(138,120,100,.5);
  padding:7px 11px 6px; border-radius:2px; cursor:pointer; transform:rotate(-1.6deg);
  transition:color .3s, border-color .3s, opacity .3s;
}
.music:hover{color:var(--ink); border-color:var(--ink)}
.music[aria-pressed="false"]{opacity:.55}
.music i{width:7px; height:7px; border-radius:50%; background:var(--sage); display:block; flex:none}
.music[aria-pressed="false"] i{background:var(--pencil)}

/* -- finale letter --------------------------------------------------- */
.veil{
  position:fixed; inset:0; z-index:40; display:grid; place-items:center;
  padding:clamp(14px,4vw,40px);
  background:radial-gradient(70% 60% at 50% 40%, rgba(60,44,32,.55), rgba(32,26,20,.86));
  opacity:0; pointer-events:none; transition:opacity .8s;
  backdrop-filter:blur(2px);
}
.veil.open{opacity:1; pointer-events:auto}

.letter{
  position:relative; width:min(620px,100%); max-height:100%; overflow:auto;
  background:linear-gradient(#FBF3E6,#F3E7D4);
  padding:clamp(30px,5vw,54px) clamp(26px,5vw,58px) clamp(34px,5vw,56px);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.7);
  transform:perspective(1400px) rotateX(-88deg) translateY(-40px);
  transform-origin:50% 0; opacity:0;
  transition:transform 1.1s cubic-bezier(.2,.85,.25,1) .18s, opacity .5s .18s;
  border-radius:2px;
}
.veil.open .letter{transform:perspective(1400px) rotateX(0) translateY(0); opacity:1}
.letter::before{ /* fold crease */
  content:''; position:absolute; left:0; right:0; top:33%; height:2px;
  background:linear-gradient(90deg,transparent,rgba(140,110,80,.28) 12%,rgba(140,110,80,.28) 88%,transparent);
}
.letter h2{font-family:var(--hand); font-weight:700; font-size:clamp(30px,4.4vw,42px); margin:0 0 .5em}
.letter p{
  font-family:var(--hand); font-size:clamp(20px,2.7vw,26px); line-height:1.42;
  margin:0 0 .62em; color:var(--ink);
  opacity:0; transform:translateY(9px);
}
.letter p.in{animation:rise .6s ease forwards}
@keyframes rise{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
.letter .off{font-family:var(--script); font-size:clamp(32px,4.6vw,44px); color:var(--rose); margin-top:.5em; line-height:1}
.caret{display:inline-block; width:2px; height:.9em; background:var(--ink); vertical-align:-.08em;
  margin-left:2px; animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* -- confetti -------------------------------------------------------- */
#fall{position:fixed; inset:0; z-index:50; pointer-events:none; overflow:hidden}
.bit{position:absolute; top:-6vh; will-change:transform; animation:drop linear forwards}
@keyframes drop{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.12s !important}
  .caret{animation:none}
}

/* -- phone ----------------------------------------------------------- */
@media (max-width:560px){
  .spread{padding-left:52px; padding-right:20px}
  .pinned{width:150px; margin-top:26px; margin-bottom:14px}
  .ask{max-width:none}
  .sign{position:static; text-align:left; margin-top:34px}
  .music{position:static; margin-top:22px; align-self:flex-start}
  .head{gap:10px}
}
/* -- big screens: keep the sheet a sheet ----------------------------- */
@media (min-width:1400px){ .spread{width:1000px} }
</style>
</head>
<body>

<main class="spread" id="spread">
  <div class="grain"></div>
  <div class="holes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <svg id="trail" aria-hidden="true"></svg>

  <div class="layer">
    <div class="head">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <div class="dedication" id="dedication"></div>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>

    <!-- SWAP IN A REAL PHOTO: replace the <svg> below with
         <img src="us.jpg" alt="">  -- the frame crops it for you. -->
    <div class="pinned" id="pinned">
      <span class="tape t1"></span>
      <figure class="polaroid">
        <div class="well">
          <svg viewBox="0 0 100 100" aria-hidden="true" style="width:100%;height:100%">
            <g fill="none" stroke="#2C3A54" stroke-width="1.6" stroke-linecap="round" opacity=".8">
              <path d="M50 78C36 68 24 58 20 46c-4-12 4-22 14-22 7 0 13 5 16 10 3-5 9-10 16-10 10 0 18 10 14 22-4 12-16 22-30 32z"/>
              <path d="M31 40c3-6 8-9 13-9M28 49c1 5 5 10 10 14M62 33c5 1 9 5 10 10" opacity=".45"/>
            </g>
            <g stroke="#C04E68" stroke-width="1.2" stroke-linecap="round" opacity=".26">
              <path d="M31 47l7 8M36 44l9 10M41 41l10 11M46 39l10 11M51 38l9 10"/>
            </g>
          </svg>
        </div>
        <figcaption id="cap"></figcaption>
      </figure>
      <span class="tape t2"></span>
    </div>

    <div class="mid">
      <h1 class="ask" id="ask"></h1>
      <p class="sub" id="sub"></p>

      <div class="choices" id="choices">
        <button class="btn" id="yes"></button>
        <button class="btn" id="no"></button>
        <p class="aside" id="aside"></p>
      </div>
    </div>

    <div class="sign"><small id="signPre"></small><span id="signName"></span></div>
  </div>

  <button class="music" id="music" aria-pressed="false"><i></i><span id="musicLabel">music off</span></button>
</main>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="lh">
  <article class="letter">
    <h2 id="lh"></h2>
    <div id="lbody"></div>
    <p class="off" id="loff"></p>
  </article>
</div>
<div id="fall" aria-hidden="true"></div>

<script>
/* ======================================================================
   EVERYTHING YOU MIGHT WANT TO CHANGE LIVES IN THIS ONE OBJECT.
   ====================================================================== */
const CONFIG = {
  herName:    "Aliya",
  eyebrow:    "a page from my notebook",
  dedication: "for Aliya",
  dateStamp:  "28 \u00B7 07 \u00B7 2026",

  askBefore: "Will you be ",
  askAccent: "my girlfriend",       // this bit gets the red underline
  askAfter:  "?",
  sub:       "Two buttons. One of them is honest.",

  polaroidCaption: "us.",

  yesLabel: "Yes",
  // the No button wears these in order, then falls off the page
  noLabels: ["No", "No?", "you sure?", "think again", "please\u2026", "last chance", "I'll wait"],
  asideAfterItFalls: "(it fell off the page. I'd call that a sign.)",

  signPre:  "always,",
  signName: "Manit",

  letter: {
    heading: "Hey Aliya,",
    lines: [
      "I rewrote this about nine times and every version sounded too small for what I actually meant.",
      "So, plainly: you are my favourite part of an ordinary day. You make the boring hours worth showing up for.",
      "I want the early mornings, the bad films you defend, the long drives, the arguments about where to eat.",
      "Thank you for chasing that ridiculous button until it gave up. I would have waited either way."
    ],
    signoff: "\u2014 always, Manit"
  }
};
/* =================================================================== */

const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- paint the copy ---------- */
$('#eyebrow').textContent    = CONFIG.eyebrow;
$('#dedication').textContent = CONFIG.dedication;
$('#stamp').textContent      = CONFIG.dateStamp;
document.title = 'For ' + CONFIG.herName;
$('#cap').textContent     = CONFIG.polaroidCaption;
$('#ask').innerHTML = CONFIG.askBefore +
  '<em>' + CONFIG.askAccent +
  '<svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M2 8C40 3 78 10 118 5c26-3 52 2 80 1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".55"/></svg>' +
  '</em>' + CONFIG.askAfter;
$('#sub').textContent      = CONFIG.sub;
$('#yes').textContent      = CONFIG.yesLabel;
$('#no').textContent       = CONFIG.noLabels[0];
$('#signPre').textContent  = CONFIG.signPre;
$('#signName').textContent = CONFIG.signName;
$('#lh').textContent       = CONFIG.letter.heading;
$('#loff').textContent     = CONFIG.letter.signoff;

/* == 1 == the No button, and the pen-trail it leaves behind ========== */
const spread = $('#spread'), no = $('#no'), yes = $('#yes'), trail = $('#trail'),
      choices = $('#choices');
let dodges = 0, noScale = 1, yesScale = 1, placed = false, over = false;

/* #no is absolutely positioned, so left/top are measured from whatever its
   offsetParent happens to be -- read that origin rather than assuming it. */
const origin = () => no.offsetParent.getBoundingClientRect();

function seat(){                       // park No beside Yes on first paint
  const y = yes.getBoundingClientRect(), o = origin();
  no.style.left = (y.right - o.left + 26) + 'px';
  no.style.top  = (y.top   - o.top  + 8)  + 'px';
  placed = true;
}
addEventListener('load', seat);
addEventListener('resize', () => { if (!dodges) seat(); });

const rnd = (a,b) => a + Math.random()*(b-a);

function flee(){
  if (over || !placed) return;
  const s = spread.getBoundingClientRect(), o = origin(),
        y = yes.getBoundingClientRect();
  const w = no.offsetWidth, h = no.offsetHeight;          // layout box: what
  const fromX = o.left + no.offsetLeft + w/2;             // left/top actually
  const fromY = o.top  + no.offsetTop  + h/2;             // move
  const yc = { x:y.left + y.width/2, y:y.top + y.height/2 };

  // roam the sheet, but never past the edge of what she can actually see
  const pad = 18;
  const minX = Math.max(s.left, 0) + pad;
  const maxX = Math.min(s.right, innerWidth) - w - pad;
  const minY = Math.max(s.top, 0) + pad;
  const maxY = Math.min(s.bottom, innerHeight) - h - pad;
  if (maxX <= minX || maxY <= minY) return;

  let best = null, bestScore = -1;
  for (let i = 0; i < 48; i++){                 // pick a spot that's far from
    const vx = rnd(minX, maxX), vy = rnd(minY, maxY);   // both the finger and
    const cx = vx + w/2, cy = vy + h/2;                 // the Yes button
    const dYes = Math.hypot(cx - yc.x, cy - yc.y);
    if (dYes < 170) continue;
    const dCur = Math.hypot(cx - fromX, cy - fromY);
    // a dodge, not a teleport: aim for arm's length away, never the far corner
    const score = -Math.abs(dCur - 330) + Math.min(dYes, 300)*.35;
    if (score > bestScore){ bestScore = score; best = [vx, vy, cx, cy]; }
  }
  if (!best) return;
  const [vx, vy, cx, cy] = best;

  // the trail svg sits at inset:0 on the sheet, so draw in sheet coordinates
  ink(fromX - s.left, fromY - s.top, cx - s.left, cy - s.top, w * noScale, h * noScale);

  dodges++;
  noScale = Math.max(.44, noScale * .9);
  yesScale = Math.min(1.55, yesScale * 1.075);
  no.style.setProperty('--s', noScale);
  no.style.setProperty('--r', rnd(-13, 13).toFixed(1) + 'deg');
  yes.style.setProperty('--s', yesScale.toFixed(3));
  no.style.left = (vx - o.left) + 'px';
  no.style.top  = (vy - o.top)  + 'px';
  no.textContent = CONFIG.noLabels[Math.min(dodges, CONFIG.noLabels.length - 1)];
  Audio_.rustle();

  if (dodges >= CONFIG.noLabels.length - 1){    // last label shown -- it gives up
    over = true;
    setTimeout(() => {
      no.classList.add('gone');
      no.style.setProperty('--r', '58deg');
      no.style.top = (s.bottom - o.top + 160) + 'px';
      const a = $('#aside');
      a.textContent = CONFIG.asideAfterItFalls;
      a.classList.add('show');
    }, 420);
  }
}

/* hand-drawn arrow + the ghost of where it stood */
const NS = 'http://www.w3.org/2000/svg';
function ink(x1, y1, x2, y2, w, h){
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('opacity', '0');

  const gh = document.createElementNS(NS, 'rect');
  gh.setAttribute('x', x1 - w/2); gh.setAttribute('y', y1 - h/2);
  gh.setAttribute('width', w);    gh.setAttribute('height', h);
  gh.setAttribute('rx', '2');     gh.setAttribute('fill', 'none');
  gh.setAttribute('stroke', 'var(--pencil)'); gh.setAttribute('stroke-width', '1.3');
  gh.setAttribute('stroke-dasharray', '5 5'); gh.setAttribute('opacity', '.4');
  g.appendChild(gh);

  const mx = (x1+x2)/2, my = (y1+y2)/2, dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy) || 1, bow = (Math.random() < .5 ? -1 : 1) * len * .22;
  const cxp = mx + (-dy/len)*bow, cyp = my + (dx/len)*bow;

  for (let k = 0; k < 2; k++){                  // two strokes = pen texture
    const j = () => rnd(-1.6, 1.6);
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${x1+j()} ${y1+j()} Q${cxp+j()} ${cyp+j()} ${x2+j()} ${y2+j()}`);
    p.setAttribute('fill','none'); p.setAttribute('stroke','var(--pencil)');
    p.setAttribute('stroke-width', k ? '.9' : '1.5');
    p.setAttribute('stroke-linecap','round'); p.setAttribute('opacity', k ? '.3' : '.5');
    g.appendChild(p);
  }
  const ang = Math.atan2(y2 - cyp, x2 - cxp);   // arrowhead
  const head = document.createElementNS(NS, 'path');
  const a1 = ang + 2.5, a2 = ang - 2.5, L = 13;
  head.setAttribute('d', `M${x2 + Math.cos(a1)*L} ${y2 + Math.sin(a1)*L} L${x2} ${y2} L${x2 + Math.cos(a2)*L} ${y2 + Math.sin(a2)*L}`);
  head.setAttribute('fill','none'); head.setAttribute('stroke','var(--pencil)');
  head.setAttribute('stroke-width','1.5'); head.setAttribute('stroke-linecap','round');
  head.setAttribute('opacity','.5');
  g.appendChild(head);

  trail.appendChild(g);
  requestAnimationFrame(() => {
    g.style.transition = 'opacity .5s'; g.setAttribute('opacity','1');
  });
  while (trail.childNodes.length > 9) trail.removeChild(trail.firstChild);
  [...trail.childNodes].forEach((n, i, arr) => {
    n.style.opacity = (.28 + .72 * (i / Math.max(1, arr.length - 1))).toFixed(2);
  });
}

/* triggers: hover on desktop, tap on touch, keyboard still works */
no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flee(); });
no.addEventListener('pointerdown',  e => { e.preventDefault(); flee(); });
no.addEventListener('click', e => { e.preventDefault(); flee(); });
no.addEventListener('focus', () => { if (dodges) flee(); });
spread.addEventListener('pointermove', e => {           // near-miss dodge
  if (e.pointerType !== 'mouse' || over || !placed) return;
  const n = no.getBoundingClientRect();
  const d = Math.hypot(e.clientX - (n.left + n.width/2), e.clientY - (n.top + n.height/2));
  if (d < 86) flee();
});

/* == 2 == the yes =================================================== */
yes.addEventListener('click', () => {
  Audio_.start(); Audio_.bloom();
  $('#pinned').style.transform = 'rotate(-.6deg)';
  confetti(reduce ? 22 : 84);
  setTimeout(openLetter, 620);
});

function openLetter(){
  const body = $('#lbody');
  if (!body.childElementCount){
    CONFIG.letter.lines.forEach(t => {
      const p = document.createElement('p'); p.textContent = t; body.appendChild(p);
    });
  }
  $('#veil').classList.add('open');
  const h = $('#lh'), full = CONFIG.letter.heading;
  if (!reduce){
    h.textContent = ''; h.innerHTML = '<span class="caret"></span>';
    let i = 0;
    const t = setInterval(() => {
      h.textContent = full.slice(0, ++i);
      if (i >= full.length){ clearInterval(t); }
    }, 62);
  }
  [...body.children, $('#loff')].forEach((p, i) =>
    setTimeout(() => p.classList.add('in'), 900 + i * 380));
}

/* == 3 == paper hearts & petals ===================================== */
/* hex, not var(--...): these get inlined into an SVG data URI, which has no
   access to the page's custom properties */
const CONFETTI = ['%23C04E68', '%23F0C6C0', '%23D3B392', '%2393A47C', '%23FBF4E9'];
const heartBG = c => `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21C7 17 2 13 2 8.6 2 5.5 4.4 3 7.4 3c1.9 0 3.6 1 4.6 2.5C13 4 14.7 3 16.6 3 19.6 3 22 5.5 22 8.6 22 13 17 17 12 21Z' fill='${c}'/></svg>") center/contain no-repeat`;

function confetti(n){
  const box = $('#fall');
  for (let i = 0; i < n; i++){
    const b = document.createElement('div');
    b.className = 'bit';
    const heart = Math.random() < .55, size = rnd(10, 22), col = CONFETTI[i % 5];
    b.style.left = rnd(-4, 104) + 'vw';
    b.style.width = size + 'px';
    b.style.height = (heart ? size : size * .6) + 'px';
    b.style.opacity = rnd(.7, 1);
    if (heart){ b.style.background = heartBG(col); }
    else {
      b.style.background = col.replace('%23', '#');
      b.style.borderRadius = '50% 50% 50% 50% / 60% 60% 40% 40%';
    }
    b.style.setProperty('--dx', rnd(-16, 16) + 'vw');
    b.style.setProperty('--rot', rnd(-900, 900) + 'deg');
    b.style.animationDuration = rnd(3.4, 6.4) + 's';
    b.style.animationDelay = rnd(0, 1.1) + 's';
    box.appendChild(b);
    setTimeout(() => b.remove(), 8200);
  }
}

/* == 4 == the music box  ============================================
   Synthesised on the spot, so there's no audio file to lose.
   Prefer a real song? Drop an <audio src="song.mp3" loop> in the body
   and call .play()/.pause() from the toggle instead.                  */
const Audio_ = (() => {
  let ctx, master, pad, timer, on = false, step = 0, next = 0;
  const BPM = 74, SPB = 60 / BPM, EIGHTH = SPB / 2;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  // Fmaj7 . Cmaj . Dm7 . Bbmaj7 -- warm, unhurried, resolves gently
  const CHORDS = [
    { bass: 41, notes: [65, 69, 72, 76] },
    { bass: 36, notes: [64, 67, 72, 76] },
    { bass: 38, notes: [65, 69, 72, 77] },
    { bass: 34, notes: [65, 69, 74, 77] }
  ];
  const PATTERN = [0, 2, 1, 3, 2, 1, 3, 0];

  function bell(f, t, vel){
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(),
          g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sine'; o2.type = 'triangle';
    o.frequency.value = f; o2.frequency.value = f * 2.004;
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    const g2 = ctx.createGain(); g2.gain.value = .18;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + 2.4);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(master);
    o.start(t); o2.start(t); o.stop(t + 2.5); o2.stop(t + 2.5);
  }
  function low(f, t){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.09, t + .03);
    g.gain.exponentialRampToValueAtTime(.0001, t + 1.9);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 2);
  }
  function tick(){
    while (next < ctx.currentTime + .45){
      const bar = Math.floor(step / 8) % 4, ch = CHORDS[bar], i = step % 8;
      const deg = PATTERN[i];
      const oct = (i === 3 || i === 6) ? 12 : 0;
      bell(midi(ch.notes[deg] + oct), next, rnd(.055, .1));
      if (i === 0) low(midi(ch.bass), next);
      if (i === 4 && Math.random() < .5) bell(midi(ch.notes[3] + 12), next + EIGHTH * .5, .035);
      next += EIGHTH; step++;
    }
  }
  function boot(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    const verb = ctx.createDelay(); verb.delayTime.value = .26;
    const fb = ctx.createGain(); fb.gain.value = .26;
    const wet = ctx.createGain(); wet.gain.value = .3;
    master.connect(verb); verb.connect(fb); fb.connect(verb); verb.connect(wet);
    wet.connect(ctx.destination); master.connect(ctx.destination);

    pad = ctx.createGain(); pad.gain.value = 0;
    [174.6, 261.6].forEach((f, k) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f * (k ? 1.004 : 1);
      lp.type = 'lowpass'; lp.frequency.value = 420; g.gain.value = .5;
      o.connect(lp); lp.connect(g); g.connect(pad); o.start();
    });
    pad.connect(ctx.destination);
    next = ctx.currentTime + .1;
  }
  return {
    start(){
      boot();
      if (ctx.state === 'suspended') ctx.resume();
      if (on) return;
      on = true;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(.5, ctx.currentTime + 2.2);
      pad.gain.linearRampToValueAtTime(.022, ctx.currentTime + 3.5);
      timer = setInterval(tick, 80); tick();
      paint(true);
    },
    stop(){
      if (!on) return; on = false;
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + .5);
      pad.gain.linearRampToValueAtTime(0, ctx.currentTime + .5);
      clearInterval(timer); paint(false);
    },
    get on(){ return on; },
    bloom(){                                   // little swell on "Yes"
      if (!ctx) return;
      master.gain.linearRampToValueAtTime(.72, ctx.currentTime + 1.2);
      pad.gain.linearRampToValueAtTime(.05, ctx.currentTime + 1.2);
      [65, 69, 72, 77, 81, 84].forEach((m, i) =>
        bell(midi(m), ctx.currentTime + .05 + i * .085, .12));
    },
    rustle(){                                  // paper scuff when No moves
      if (!ctx || !on) return;
      const b = ctx.createBuffer(1, 2400, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length) ** 3;
      const s = ctx.createBufferSource(), g = ctx.createGain(), hp = ctx.createBiquadFilter();
      s.buffer = b; hp.type = 'highpass'; hp.frequency.value = 1800; g.gain.value = .16;
      s.connect(hp); hp.connect(g); g.connect(ctx.destination); s.start();
    }
  };
})();

const musicBtn = $('#music');
function paint(state){
  musicBtn.setAttribute('aria-pressed', String(state));
  $('#musicLabel').textContent = state ? 'music on' : 'music off';
}
musicBtn.addEventListener('click', () => Audio_.on ? Audio_.stop() : Audio_.start());
// browsers won't autoplay -- first touch anywhere starts it
['pointerdown','keydown'].forEach(ev =>
  addEventListener(ev, function once(){ Audio_.start(); }, { once:true }));
</script>
